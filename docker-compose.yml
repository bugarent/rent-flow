services:
  postgres:
    image: postgres:16-alpine
    container_name: rentairportcars-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rentairportcars
    volumes:
      - rentairportcars_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentairportcars"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rentairportcars_pgdata:
