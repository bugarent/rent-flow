# Netlify secrets scanning fails the build when any env var value appears in the repo or build output.
# Only list PUBLIC, non-secret keys here — values that are meant to ship in pages/bundles
# (site URL, public client IDs, mode flags). Never add DATABASE_URL, *_SECRET, *_TOKEN, *_PASS, API keys.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPPORT_EMAIL,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_PAYPAL_CLIENT_ID,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,PAYPAL_CLIENT_ID,PAYPAL_MODE,SMTP_FROM,SMTP_HOST,SMTP_PORT,SMTP_SECURE,TELEGRAM_BOT_USERNAME,OPENAI_MODEL,DATA_DIR,UPLOAD_DIR,DB_CONNECT_TIMEOUT_MS,DB_QUERY_TIMEOUT_MS,EUR_USD_RATE,EUR_GBP_RATE,EUR_GEL_RATE,EUR_RUB_RATE,NODE_VERSION"
